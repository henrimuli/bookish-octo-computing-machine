# Cloudflare Email Worker for per-order submission inboxes.
# Route *@<INBOUND_EMAIL_DOMAIN> to this worker with a catch-all rule in Email Routing.
name = "debutyard-inbound-email"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
# The app's inbound endpoint.
INBOUND_URL = "https://debutyard.com/api/inbound"

# Secret, same value as INBOUND_SECRET in the app:
#   npx wrangler secret put INBOUND_SECRET
